<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Delivery Optimization Operations Dashboard</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
    <style>
        * { box-sizing: border-box; }
        body { margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #0f172a; color: #f8fafc; height: 100vh; overflow: hidden; }
        header { height: 50px; background: #1e293b; padding: 12px 20px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #334155; }
        h1 { margin: 0; font-size: 1.1rem; }
        .wrapper { display: flex; height: calc(100vh - 50px); width: 100vw; }
        .sidebar { width: 380px; min-width: 380px; height: 100%; background: #1e293b; padding: 16px; overflow-y: auto; border-right: 1px solid #334155; }
        #map { flex: 1; height: 100%; width: 100%; min-height: 100%; }
        .card { background: #0f172a; border: 1px solid #334155; border-radius: 6px; padding: 12px; margin-bottom: 14px; }
        .card h3 { margin: 0 0 8px 0; font-size: 0.9rem; color: #38bdf8; }
        label { display: block; font-size: 0.75rem; color: #94a3b8; margin-top: 6px; }
        input { width: 100%; padding: 6px 8px; background: #1e293b; border: 1px solid #475569; border-radius: 4px; color: #fff; margin-top: 3px; font-size: 0.85rem; }
        button { width: 100%; margin-top: 10px; padding: 8px; background: #0284c7; border: none; border-radius: 4px; color: white; font-weight: 600; cursor: pointer; }
        button:hover { background: #0369a1; }
        .btn-dispatch { background: #16a34a; }
        .btn-dispatch:hover { background: #15803d; }
        .status-badge { padding: 2px 6px; border-radius: 10px; font-size: 0.7rem; font-weight: 600; }
        .badge-available { background: #14532d; color: #4ade80; }
        .badge-busy { background: #7f1d1d; color: #f87171; }
        .list-item { font-size: 0.8rem; padding: 6px 0; border-bottom: 1px solid #334155; }
    </style>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
</head>
<body>
    <header>
        <h1>Delivery Optimization Operations Control</h1>
        <span style="font-size: 0.8rem; color: #94a3b8;">FastAPI Backend: <b style="color: #4ade80;">Active</b></span>
    </header>

    <div class="wrapper">
        <div class="sidebar">
            <div class="card">
                <h3>Register New Rider</h3>
                <label>Rider Name</label>
                <input id="rider-name" placeholder="Amit Sharma" />
                <label>Latitude & Longitude</label>
                <div style="display: flex; gap: 6px;">
                    <input id="rider-lat" type="number" step="0.0001" value="28.6139" />
                    <input id="rider-lng" type="number" step="0.0001" value="77.2090" />
                </div>
                <button onclick="createRider()">Add Rider</button>
            </div>

            <div class="card">
                <h3>Create New Delivery Order</h3>
                <label>Customer Name</label>
                <input id="order-customer" placeholder="Priya Singh" />
                <label>Pickup (Lat, Lng)</label>
                <div style="display: flex; gap: 6px;">
                    <input id="pickup-lat" type="number" step="0.0001" value="28.6200" />
                    <input id="pickup-lng" type="number" step="0.0001" value="77.2100" />
                </div>
                <label>Dropoff (Lat, Lng)</label>
                <div style="display: flex; gap: 6px;">
                    <input id="drop-lat" type="number" step="0.0001" value="28.6350" />
                    <input id="drop-lng" type="number" step="0.0001" value="77.2250" />
                </div>
                <button onclick="createOrder()">Create Order</button>
            </div>

            <div class="card">
                <h3>Intelligent Dispatch Engine</h3>
                <button class="btn-dispatch" onclick="triggerAutoDispatch()">Run Auto-Dispatch All Orders</button>
                <div id="dispatch-output" style="font-size: 0.75rem; margin-top: 8px; color: #cbd5e1;"></div>
            </div>

            <div class="card">
                <h3>Live Riders (<span id="rider-count">0</span>)</h3>
                <div id="riders-list" style="max-height: 160px; overflow-y: auto;">No riders found.</div>
            </div>
        </div>

        <div id="map"></div>
    </div>

    <script>
        window.addEventListener('DOMContentLoaded', () => {
            const map = L.map('map').setView([28.6139, 77.2090], 12);

            L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
                maxZoom: 19,
                attribution: '&copy; OpenStreetMap'
            }).addTo(map);

            setTimeout(() => { map.invalidateSize(); }, 200);

            let riderMarkers = {};
            let orderMarkers = [];

            async function loadRiders() {
                try {
                    let res = await fetch('/riders/');
                    if (!res.ok) res = await fetch('/riders');
                    const riders = await res.json();
                    const listEl = document.getElementById('riders-list');
                    const countEl = document.getElementById('rider-count');
                    
                    const items = Array.isArray(riders) ? riders : (riders.items || []);
                    countEl.innerText = items.length;
                    listEl.innerHTML = '';

                    Object.values(riderMarkers).forEach(m => map.removeLayer(m));
                    riderMarkers = {};

                    if (items.length === 0) {
                        listEl.innerHTML = '<span style="color:#94a3b8;font-size:0.75rem;">No riders registered yet.</span>';
                        return;
                    }

                    items.forEach(r => {
                        const lat = r.current_lat ?? 28.6139;
                        const lng = r.current_lng ?? r.current_lon ?? 77.2090;
                        const isAvail = (r.status === 'AVAILABLE') || (r.is_active === true);
                        const statusClass = isAvail ? 'badge-available' : 'badge-busy';
                        const statusText = r.status || (isAvail ? 'AVAILABLE' : 'BUSY');

                        listEl.innerHTML += `
                            <div class="list-item">
                                <b>${r.name}</b> <span class="status-badge ${statusClass}">${statusText}</span><br>
                                <span style="color:#94a3b8;">${r.vehicle_type || 'bike'} | (${lat.toFixed(3)}, ${lng.toFixed(3)})</span>
                            </div>
                        `;

                        const marker = L.circleMarker([lat, lng], {
                            radius: 8,
                            color: '#38bdf8',
                            fillColor: '#0284c7',
                            fillOpacity: 0.9
                        }).addTo(map).bindPopup(`<b>Rider: ${r.name}</b><br>Status: ${statusText}`);
                        riderMarkers[r.id] = marker;
                    });
                } catch (e) {
                    document.getElementById('riders-list').innerText = 'Error loading riders.';
                }
            }

            async function loadOrders() {
                try {
                    let res = await fetch('/orders/');
                    if (!res.ok) res = await fetch('/orders');
                    const orders = await res.json();
                    const items = Array.isArray(orders) ? orders : (orders.items || []);

                    orderMarkers.forEach(m => map.removeLayer(m));
                    orderMarkers = [];

                    items.filter(o => o.status === 'PENDING').forEach(o => {
                        const pLat = o.pickup_lat;
                        const pLng = o.pickup_lng ?? o.pickup_lon;
                        const dLat = o.drop_lat ?? o.dropoff_lat;
                        const dLng = o.drop_lng ?? o.dropoff_lng ?? o.dropoff_lon;

                        if (pLat && pLng) {
                            const pMark = L.marker([pLat, pLng]).addTo(map).bindPopup(`<b>Pickup Order #${o.id}</b><br>Customer: ${o.customer_name}`);
                            orderMarkers.push(pMark);
                        }
                        if (dLat && dLng) {
                            const dMark = L.marker([dLat, dLng]).addTo(map).bindPopup(`<b>Dropoff Order #${o.id}</b><br>Customer: ${o.customer_name}`);
                            orderMarkers.push(dMark);
                        }
                    });
                } catch (e) {}
            }

            window.createRider = async function() {
                const name = document.getElementById('rider-name').value.trim();
                const lat = parseFloat(document.getElementById('rider-lat').value);
                const lng = parseFloat(document.getElementById('rider-lng').value);
                if (!name) return alert('Enter rider name');

                const payload = {
                    name: name,
                    phone: "+91-" + Math.floor(1000000000 + Math.random() * 9000000000),
                    vehicle_type: "bike",
                    current_lat: lat,
                    current_lng: lng,
                    status: "AVAILABLE",
                    max_capacity: 3
                };

                let res = await fetch('/riders/', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
                if (!res.ok && res.status === 404) {
                    res = await fetch('/riders', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(payload)
                    });
                }

                if (res.ok) {
                    document.getElementById('rider-name').value = '';
                    loadRiders();
                } else {
                    const err = await res.json();
                    alert('Error: ' + JSON.stringify(err.detail || err));
                }
            };

            window.createOrder = async function() {
                const customer = document.getElementById('order-customer').value.trim();
                const pLat = parseFloat(document.getElementById('pickup-lat').value);
                const pLng = parseFloat(document.getElementById('pickup-lng').value);
                const dLat = parseFloat(document.getElementById('drop-lat').value);
                const dLng = parseFloat(document.getElementById('drop-lng').value);
                if (!customer) return alert('Enter customer name');

                const payload = {
                    customer_name: customer,
                    customer_phone: "+91-9876500000",
                    pickup_address: "Connaught Place, New Delhi",
                    delivery_address: "Barakhamba Road, New Delhi",
                    dropoff_address: "Barakhamba Road, New Delhi",
                    pickup_lat: pLat,
                    pickup_lng: pLng,
                    drop_lat: dLat,
                    drop_lng: dLng,
                    dropoff_lat: dLat,
                    dropoff_lng: dLng,
                    weight_kg: 1.5
                };

                let res = await fetch('/orders/', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
                if (!res.ok && res.status === 404) {
                    res = await fetch('/orders', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(payload)
                    });
                }

                if (res.ok) {
                    document.getElementById('order-customer').value = '';
                    alert('Order created successfully!');
                    loadOrders();
                } else {
                    const err = await res.json();
                    alert('Error: ' + JSON.stringify(err.detail || err));
                }
            };

            window.triggerAutoDispatch = async function() {
                const out = document.getElementById('dispatch-output');
                out.innerText = 'Assigning pending orders...';
                try {
                    let res = await fetch('/orders/');
                    if (!res.ok) res = await fetch('/orders');
                    const orders = await res.json();
                    const pending = (Array.isArray(orders) ? orders : (orders.items || []))
                        .filter(o => o.status === 'PENDING');

                    if (pending.length === 0) {
                        out.innerText = 'No pending orders found to assign.';
                        return;
                    }

                    let assignedCount = 0;
                    for (const order of pending) {
                        const assignRes = await fetch(`/dispatch/assign/${order.id}`, { method: 'POST' });
                        if (assignRes.ok) assignedCount++;
                    }

                    out.innerText = `Assigned ${assignedCount} order(s) successfully!`;
                    loadRiders();
                    loadOrders();
                } catch (e) {
                    out.innerText = 'Dispatch failed: ' + e;
                }
            };

            loadRiders();
            loadOrders();
        });
    </script>
</body>
</html>
